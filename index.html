<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="T2 Luzern"/>
<meta name="theme-color" content="#050508"/>
<title>T2 Luzern</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#050508; --s1:#0a0a10; --s2:#101018; --s3:#161620;
  --rim:#1e1e2c; --rim2:#272738;
  --txt:#e2e2f0; --sub:#6868a0; --sub2:#3a3a58;
  --g:#05e87a; --g1:rgba(5,232,122,.10); --g2:rgba(5,232,122,.22);
  --a:#f5b800; --a1:rgba(245,184,0,.10); --a2:rgba(245,184,0,.25);
  --r:#ff3356; --r1:rgba(255,51,86,.10); --r2:rgba(255,51,86,.25);
  --b:#2d8fff; --b1:rgba(45,143,255,.10);
  --rad:12px; --radL:16px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Space Grotesk',sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{border:none;cursor:pointer;font-family:inherit}
input,textarea{font-family:inherit}
#wrap{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}

/* HEADER */
.hdr{padding:calc(var(--st)+12px) 16px 12px;background:var(--bg);border-bottom:1px solid var(--rim);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.logo{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:900;letter-spacing:-.3px}
.logo b{color:var(--g)}
.hdr-pills{display:flex;gap:6px}
.xpill{padding:5px 11px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px;border:1px solid;text-transform:uppercase}
.xpill-g{background:var(--g1);color:var(--g);border-color:var(--g2)}
.xpill-a{background:var(--a1);color:var(--a);border-color:var(--a2)}

/* TABS */
.nav{display:flex;background:var(--bg);border-bottom:1px solid var(--rim);padding:8px 12px;gap:5px}
.ntab{flex:1;height:38px;border-radius:10px;border:1px solid var(--rim2);background:var(--s1);color:var(--sub);font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;transition:all .14s}
.ntab.on{background:var(--g1);border-color:var(--g2);color:var(--g)}

/* SCREENS */
.pg{display:none;flex:1;overflow-y:auto;padding:14px 12px;padding-bottom:calc(var(--sb)+28px)}
.pg.on{display:block}
.slbl{font-size:9px;letter-spacing:3px;color:var(--sub);text-transform:uppercase;margin:18px 0 8px}
.slbl:first-child{margin-top:0}
.empty-msg{text-align:center;color:var(--sub);padding:50px 20px;font-size:13px;line-height:2}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:52px;padding:0 20px;border-radius:var(--rad);font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;letter-spacing:.2px;transition:all .12s;white-space:nowrap;border:1px solid transparent}
.btn:active{transform:scale(.93);opacity:.85}
.btn-g{background:var(--g);color:#000;border-color:var(--g)}
.btn-s{background:var(--s2);color:var(--txt);border-color:var(--rim2)}
.btn-a{background:var(--a1);color:var(--a);border-color:var(--a2)}
.btn-r{background:var(--r1);color:var(--r);border-color:var(--r2)}
.btn-w{width:100%;display:flex}
.brow{display:flex;gap:8px;margin-bottom:8px}

/* PARSE */
.paste-area{width:100%;min-height:148px;background:var(--s1);border:1px solid var(--rim2);border-radius:var(--radL);color:var(--txt);font-family:'Space Grotesk',sans-serif;font-size:14px;padding:16px;outline:none;resize:none;line-height:1.7;transition:border-color .2s}
.paste-area:focus{border-color:var(--g2)}
.paste-area::placeholder{color:var(--sub2)}
.detect-box{display:none;background:var(--g1);border:1px solid var(--g2);border-radius:var(--rad);padding:14px 16px;margin-top:10px}
.detect-box.show{display:block}
.detect-title{font-size:9px;color:var(--g);letter-spacing:3px;text-transform:uppercase;margin-bottom:9px}
.detect-tags{display:flex;flex-wrap:wrap;gap:6px}
.dtag{background:var(--g);color:#000;border-radius:8px;padding:5px 12px;font-family:'Unbounded',sans-serif;font-size:14px;font-weight:700}
.madd-row{display:flex;gap:8px;margin-top:8px}
.num-in{width:80px;height:52px;background:var(--s1);border:1px solid var(--rim2);border-radius:var(--rad);color:var(--txt);font-size:22px;font-weight:700;text-align:center;outline:none;transition:border-color .2s}
.num-in:focus{border-color:var(--g2)}
.sgrid{display:none;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.sgrid.open{display:grid}
.sg{aspect-ratio:1;border-radius:9px;border:1px solid var(--rim2);background:var(--s1);color:var(--sub);font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;transition:all .12s;display:flex;align-items:center;justify-content:center}
.sg:active{transform:scale(.83)}
.sg.on{background:var(--g1);border-color:var(--g);color:var(--g)}

/* ROUTE CARDS */
.rcards{display:flex;flex-direction:column;gap:8px}
.rcard{background:var(--s1);border:1px solid var(--rim2);border-radius:var(--radL);overflow:hidden;transition:border-color .2s}
.rcard.is-cur{border-color:var(--g)}
.rcard.is-kp{border-color:var(--r)}
.rcard.is-gp{border-color:var(--a)}
.rcard.is-done{opacity:.28;pointer-events:none}
.rc-top{display:flex;align-items:stretch;min-height:72px}
.rc-gps{width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--g1);flex-shrink:0;cursor:pointer;border:none;transition:all .13s;gap:3px;padding:8px 0}
.rc-gps:active{background:var(--g);transform:scale(.95)}
.rc-gps-num{font-family:'Unbounded',sans-serif;font-size:24px;font-weight:900;color:var(--g);line-height:1}
.rc-gps-ico{font-size:14px;opacity:.65}
.rcard.is-done .rc-gps{background:transparent}
.rcard.is-done .rc-gps-num{color:var(--sub)}
.rcard.is-kp .rc-gps{background:var(--r1)}
.rcard.is-kp .rc-gps-num{color:var(--r)}
.rc-info{flex:1;padding:10px 12px;min-width:0;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.rc-name{font-size:12px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.rc-addr{font-size:9px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.rc-note{font-size:9px;color:var(--a);line-height:1.4}
.rc-right{display:flex;align-items:center;gap:6px;padding:0 10px;flex-shrink:0}
.stbadge{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:700;padding:5px 9px;border-radius:8px;min-width:44px;text-align:center;border:1px solid;white-space:nowrap}
.st-ok{background:var(--g1);color:var(--g);border-color:var(--g2)}
.st-z{background:var(--s2);color:var(--sub);border-color:var(--rim2)}
.st-kp{background:var(--r1);color:var(--r);border-color:var(--r2)}
.st-gp{background:var(--a1);color:var(--a);border-color:var(--a2)}
.dring{width:32px;height:32px;border-radius:50%;border:2px solid var(--rim2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .14s;flex-shrink:0}
.dring.on{background:var(--g);border-color:var(--g)}
.dring.on::after{content:'✓';color:#000;font-size:15px;font-weight:900}
.rc-entry{border-top:1px solid var(--rim);padding:12px;display:none;flex-wrap:wrap;gap:8px;align-items:center}
.rc-entry.open{display:flex}
.gps-row-btn{width:100%;height:46px;border-radius:10px;background:var(--g1);color:var(--g);border:1px solid var(--g2);font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .12s}
.gps-row-btn:active{background:var(--g);color:#000;transform:scale(.97)}
.ctr{display:flex;align-items:center;gap:9px}
.cbtn{width:52px;height:52px;border-radius:12px;border:1px solid var(--rim2);background:var(--bg);color:var(--txt);font-family:'Unbounded',sans-serif;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .11s}
.cbtn:active{transform:scale(.82);background:var(--s2)}
.cval{font-family:'Unbounded',sans-serif;font-size:40px;font-weight:900;color:var(--g);min-width:50px;text-align:center;line-height:1}
.cval.z{color:var(--sub)}
.sp-row{display:flex;gap:7px;margin-left:auto}
.spbtn{height:52px;padding:0 15px;border-radius:12px;font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700;border:1px solid;transition:all .12s;letter-spacing:.5px}
.spbtn:active{transform:scale(.87)}
.sp-gp{background:var(--a1);color:var(--a);border-color:var(--a2)}
.sp-gp.lit{background:var(--a);color:#000;border-color:var(--a)}
.sp-kp{background:var(--r1);color:var(--r);border-color:var(--r2)}
.sp-kp.lit{background:var(--r);color:#fff;border-color:var(--r)}
.gp-tags{display:flex;flex-wrap:wrap;gap:5px;width:100%}
.gptag{background:var(--a1);color:var(--a);border:1px solid var(--a2);border-radius:7px;padding:4px 10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.gptag::after{content:'×';font-size:15px;opacity:.6}

/* MAP ROW */
.map-row{display:flex;gap:8px;margin-bottom:12px}

/* SUMMARY */
.sum-hero{background:var(--g1);border:1px solid var(--g2);border-radius:var(--radL);padding:24px;text-align:center;margin-bottom:14px}
.sum-num{font-family:'Unbounded',sans-serif;font-size:76px;font-weight:900;color:var(--g);line-height:1}
.sum-lbl{font-size:10px;color:var(--sub);letter-spacing:3px;text-transform:uppercase;margin-top:5px}
.wa-preview{background:var(--s1);border:1px solid var(--rim2);border-radius:var(--rad);padding:16px 18px;margin-bottom:12px;font-family:'Space Grotesk',sans-serif;font-size:16px;line-height:2.1}
.wa-n{color:var(--g);font-weight:700}
.wa-g{color:var(--a);font-weight:700}
.wa-k{color:var(--r);font-weight:700}
.det-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.det-row{display:flex;align-items:center;padding:11px 14px;background:var(--s1);border:1px solid var(--rim);border-radius:11px}
.dr-id{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:900;color:var(--g);min-width:40px}
.dr-name{flex:1;font-size:10px;padding:0 10px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-val{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:700}
.dv-g{color:var(--g)}.dv-k{color:var(--r)}.dv-a{color:var(--a)}

/* HISTORY */
.hcard{background:var(--s1);border:1px solid var(--rim2);border-radius:var(--radL);padding:14px;margin-bottom:8px}
.hcard-date{font-size:9px;color:var(--sub);margin-bottom:8px;letter-spacing:1px}
.hcard-stats{display:flex;gap:18px;margin-bottom:8px}
.hstat{font-size:12px;color:var(--txt)}
.hstat b{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:900;color:var(--g)}
.hcard-wa{font-size:11px;color:var(--sub);line-height:1.8;font-family:monospace}

/* MODAL */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:60;align-items:flex-end;justify-content:center}
.mbg.open{display:flex}
.modal{background:var(--s1);border:1px solid var(--rim2);border-radius:22px 22px 0 0;padding:22px 16px calc(var(--sb)+24px);width:100%;max-width:520px}
.mo-num{font-family:'Unbounded',sans-serif;font-size:42px;font-weight:900;color:var(--g);margin-bottom:3px}
.mo-name{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:2px}
.mo-addr{font-size:11px;color:var(--sub);margin-bottom:13px}
.mo-note{font-size:12px;color:var(--a);line-height:1.65;padding:13px;background:var(--a1);border-radius:10px;border:1px solid var(--a2);margin-bottom:14px}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--sb)+20px);left:50%;transform:translateX(-50%) translateY(80px);background:var(--g);color:#000;padding:12px 26px;border-radius:40px;font-size:13px;font-weight:700;z-index:100;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.hdiv{height:1px;background:var(--rim);margin:14px 0}
.gap8{height:8px}
</style>
</head>
<body>
<div id="wrap">

<div class="hdr">
  <div class="logo">T2 <b>Luzern</b></div>
  <div class="hdr-pills">
    <span class="xpill xpill-a" id="b-sacs">0 Sacs</span>
    <span class="xpill xpill-g" id="b-stops">0 Stops</span>
  </div>
</div>

<div class="nav">
  <button class="ntab on" onclick="go('parse')">① Parse</button>
  <button class="ntab"    onclick="go('tour')">② Tournée</button>
  <button class="ntab"    onclick="go('sum')">③ Résumé</button>
  <button class="ntab"    onclick="go('hist')">Histo</button>
</div>

<!-- PARSE -->
<div class="pg on" id="pg-parse">
  <div class="slbl">Coller le message WhatsApp</div>
  <textarea class="paste-area" id="paste" rows="6"
    placeholder="TOUR Position N&#10;T2 Luzern 7&#10;T2 Luzern 13&#10;T2 Luzern 17&#10;..."
    oninput="onPasteInput()"></textarea>
  <div class="detect-box" id="dbox">
    <div class="detect-title">Stops détectés</div>
    <div class="detect-tags" id="dtags"></div>
  </div>
  <div class="brow" style="margin-top:10px">
    <button class="btn btn-s" style="flex:1" onclick="clearPaste()">Effacer</button>
    <button class="btn btn-g" style="flex:2" onclick="confirmParse()">Confirmer →</button>
  </div>
  <div class="hdiv"></div>
  <div class="slbl">Ajouter manuellement</div>
  <div class="madd-row">
    <input class="num-in" id="mnum" type="number" min="1" max="43" placeholder="N°" inputmode="numeric"/>
    <button class="btn btn-s" style="flex:1" onclick="addManual()">+ Ajouter</button>
    <button class="btn btn-s" id="grid-tog" onclick="toggleGrid()">Grille</button>
  </div>
  <div class="sgrid" id="sgrid"></div>
  <div class="hdiv"></div>
  <button class="btn btn-r btn-w" onclick="newTour()">🗑 Nouvelle tournée</button>
</div>

<!-- TOURNÉE -->
<div class="pg" id="pg-tour">
  <div class="map-row">
    <button class="btn btn-g" style="flex:1" onclick="mapsAll()">🗺 GPS Tournée complète</button>
    <button class="btn btn-a" onclick="mapsNext()">Suivant →</button>
  </div>
  <div class="slbl" id="tour-lbl">Stops</div>
  <div class="rcards" id="rcards"></div>
</div>

<!-- RÉSUMÉ -->
<div class="pg" id="pg-sum">
  <div class="sum-hero">
    <div class="sum-num" id="sum-total">0</div>
    <div class="sum-lbl">sacs récupérés</div>
  </div>
  <div class="slbl" id="sum-date"></div>
  <div class="wa-preview" id="wa-prev"></div>
  <button class="btn btn-g btn-w" onclick="copyWA()" style="height:56px;font-size:14px;margin-bottom:10px">📋 Copier pour WhatsApp</button>
  <div class="det-list" id="det-list"></div>
  <div class="hdiv"></div>
  <button class="btn btn-r btn-w" onclick="saveTour()">💾 Sauvegarder &amp; terminer</button>
</div>

<!-- HISTORIQUE -->
<div class="pg" id="pg-hist">
  <div class="slbl">Tournées précédentes</div>
  <div id="hist-list"></div>
  <div class="gap8"></div>
  <button class="btn btn-r btn-w" onclick="clearHist()">🗑 Effacer l'historique</button>
</div>

</div>

<!-- MODAL -->
<div class="mbg" id="mbg">
  <div class="modal">
    <div class="mo-num" id="mo-num"></div>
    <div class="mo-name" id="mo-name"></div>
    <div class="mo-addr" id="mo-addr"></div>
    <div class="mo-note" id="mo-note"></div>
    <button class="btn btn-a btn-w" id="mo-gps" style="margin-bottom:8px">🗺 Ouvrir dans Google Maps</button>
    <button class="btn btn-r btn-w" id="mo-del" style="margin-bottom:8px">🗑 Supprimer ce stop</button>
    <button class="btn btn-s btn-w" onclick="closeMo()">Fermer</button>
  </div>
</div>

<div class="toast" id="toast"></div>

const SM=Object.fromEntries(STOPS.map(s=>[s.id,s]));

let sel=new Set(),dat={},done=new Set(),gridOpen=false;
function D(id){if(!dat[id])dat[id]={bags:0,gps:0,kp:false};return dat[id];}

function init(){
  const g=document.getElementById('sgrid');
  STOPS.forEach(s=>{
    const b=document.createElement('button');
    b.className='sg';b.id=`sg-${s.id}`;b.textContent=s.id;
    b.onclick=()=>toggleSel(s.id);g.appendChild(b);
  });
  loadState();renderHist();
}

function go(name){
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.ntab').forEach(t=>t.classList.remove('on'));
  document.getElementById(`pg-${name}`).classList.add('on');
  ['parse','tour','sum','hist'].forEach((x,i)=>{if(x===name)document.querySelectorAll('.ntab')[i].classList.add('on');});
  if(name==='tour')renderTour();
  if(name==='sum')renderSum();
  if(name==='hist')renderHist();
}

function onPasteInput(){
  const txt=document.getElementById('paste').value;
  const ids=parseWA(txt);
  const box=document.getElementById('dbox');
  if(!ids.length){box.classList.remove('show');return;}
  box.classList.add('show');
  document.getElementById('dtags').innerHTML=ids.map(id=>`<span class="dtag">${id}</span>`).join('');
}

function parseWA(txt){
  const found=new Set();
  const r1=/luzern\s+(\d+)/gi;let m;
  while((m=r1.exec(txt))!==null){const n=parseInt(m[1]);if(n>=1&&n<=43)found.add(n);}
  if(!found.size){
    txt.split(/\n/).forEach(l=>{const t=l.trim(),n=parseInt(t);if(!isNaN(n)&&n>=1&&n<=43&&String(n)===t)found.add(n);});
  }
  if(!found.size){
    const r3=/\b([1-9]|[1-3]\d|4[0-3])\b/g;
    while((m=r3.exec(txt))!==null){const n=parseInt(m[1]);if(n>=1&&n<=43)found.add(n);}
  }
  return[...found].sort((a,b)=>a-b);
}

function confirmParse(){
  const txt=document.getElementById('paste').value.trim();
  if(!txt){toast('Colle d\'abord un message');return;}
  const ids=parseWA(txt);
  if(!ids.length){toast('Aucun stop détecté');return;}
  ids.forEach(id=>sel.add(id));
  syncGrid();badge();saveState();
  toast(`${ids.length} stop(s) ajouté(s) ✓`);
  document.getElementById('paste').value='';
  document.getElementById('dbox').classList.remove('show');
  go('tour');
}

function clearPaste(){
  document.getElementById('paste').value='';
  document.getElementById('dbox').classList.remove('show');
}

function toggleSel(id){
  sel.has(id)?sel.delete(id):sel.add(id);
  document.getElementById(`sg-${id}`).classList.toggle('on',sel.has(id));
  badge();saveState();
}
function syncGrid(){STOPS.forEach(s=>{const el=document.getElementById(`sg-${s.id}`);if(el)el.classList.toggle('on',sel.has(s.id));});}
function addManual(){
  const el=document.getElementById('mnum');const n=parseInt(el.value);
  if(!n||n<1||n>43){toast('Numéro entre 1 et 43');return;}
  sel.add(n);syncGrid();badge();saveState();el.value='';
  toast(`Stop #${n} ajouté`);
}
function toggleGrid(){
  gridOpen=!gridOpen;
  document.getElementById('sgrid').classList.toggle('open',gridOpen);
  const btn=document.getElementById('grid-tog');
  btn.style.background=gridOpen?'var(--g1)':'';
  btn.style.color=gridOpen?'var(--g)':'';
  btn.style.borderColor=gridOpen?'var(--g2)':'';
}
function newTour(){
  if(!confirm('Effacer toute la tournée en cours ?'))return;
  sel.clear();dat={};done.clear();syncGrid();badge();saveState();
  toast('Nouvelle tournée prête');
}
function badge(){
  document.getElementById('b-stops').textContent=`${sel.size} Stops`;
  let t=0;sel.forEach(id=>{const d=dat[id];if(d&&!d.kp)t+=(d.bags||0)+(d.gps||0);});
  document.getElementById('b-sacs').textContent=`${t} Sacs`;
}
function sorted(){return[...sel].sort((a,b)=>a-b).map(id=>SM[id]).filter(Boolean);}

function renderTour(){
  const stops=sorted();
  document.getElementById('tour-lbl').textContent=`${stops.length} stop(s) aujourd'hui`;
  const rc=document.getElementById('rcards');
  if(!stops.length){rc.innerHTML='<div class="empty-msg">Aucun stop.<br>← Retour à Parse.</div>';return;}
  rc.innerHTML='';
  const fp=stops.findIndex(s=>!done.has(s.id));
  stops.forEach((s,i)=>{
    const isDone=done.has(s.id),isCur=i===fp,d=D(s.id);
    let cc='rcard';
    if(isDone)cc+=' is-done';else if(isCur)cc+=' is-cur';
    if(!isDone&&d.kp)cc+=' is-kp';else if(!isDone&&(d.gps||0)>0)cc+=' is-gp';
    let bh='';
    if(d.kp)bh=`<div class="stbadge st-kp">KP</div>`;
    else{
      const tot=(d.bags||0)+(d.gps||0);
      if(tot===0)bh=`<div class="stbadge st-z">—</div>`;
      else if(d.bags>0&&d.gps>0)bh=`<div class="stbadge st-gp">${d.bags}+${d.gps}GP</div>`;
      else if(d.gps>0)bh=`<div class="stbadge st-gp">${d.gps}GP</div>`;
      else bh=`<div class="stbadge st-ok">${d.bags}</div>`;
    }
    const np=s.note?`<div class="rc-note">💡 ${s.note.length>58?s.note.slice(0,58)+'…':s.note}</div>`:'';
    let gpt='';for(let g=0;g<(d.gps||0);g++)gpt+=`<span class="gptag" onclick="rmGP(${s.id},event)">GP${(d.gps||0)>1?` ${g+1}`:''}</span>`;
    const card=document.createElement('div');
    card.className=cc;card.id=`rc-${s.id}`;
    card.innerHTML=`
      <div class="rc-top">
        <button class="rc-gps" onclick="gmStop(${s.id})">
          <span class="rc-gps-num">${s.id}</span>
          <span class="rc-gps-ico">🗺</span>
        </button>
        <div class="rc-info" onclick="openMo(${s.id})">
          <div class="rc-name">${s.n}</div>
          <div class="rc-addr">${s.a}</div>
          ${np}
        </div>
        <div class="rc-right">${bh}<div class="dring${isDone?' on':''}" onclick="toggleDone(${s.id})"></div></div>
      </div>
      <div class="rc-entry${isDone?'':' open'}" id="ep-${s.id}">
        <button class="gps-row-btn" onclick="gmStop(${s.id})">🗺 Naviguer vers ce stop</button>
        <div class="ctr">
          <button class="cbtn" onclick="chgBag(${s.id},-1)">−</button>
          <div class="cval${(d.bags||0)===0?' z':''}" id="bv-${s.id}">${d.bags||0}</div>
          <button class="cbtn" onclick="chgBag(${s.id},1)">+</button>
        </div>
        <div class="sp-row">
          <button class="spbtn sp-gp${(d.gps||0)>0?' lit':''}" onclick="addGP(${s.id})">+GP</button>
          <button class="spbtn sp-kp${d.kp?' lit':''}" onclick="togKP(${s.id})">KP</button>
        </div>
        ${gpt?`<div class="gp-tags">${gpt}</div>`:''}
      </div>`;
    rc.appendChild(card);
  });
}

function chgBag(id,delta){const d=D(id);if(d.kp)return;d.bags=Math.max(0,(d.bags||0)+delta);saveState();badge();renderTour();}
function addGP(id){const d=D(id);if(d.kp)return;d.gps=(d.gps||0)+1;saveState();badge();renderTour();}
function rmGP(id,e){e.stopPropagation();const d=D(id);if(d.gps>0)d.gps--;saveState();badge();renderTour();}
function togKP(id){const d=D(id);d.kp=!d.kp;if(d.kp){d.bags=0;d.gps=0;}saveState();badge();renderTour();}
function toggleDone(id){done.has(id)?done.delete(id):done.add(id);saveState();badge();renderTour();}

function fixAddr(a){return a.replace(/ü/g,'ue').replace(/Ü/g,'Ue').replace(/ä/g,'ae').replace(/Ä/g,'Ae').replace(/ö/g,'oe').replace(/Ö/g,'Oe').replace(/[–—»«→]/g,'-');}
function openGM(addr){window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(fixAddr(addr))}`);}
function gmStop(id){const s=SM[id];if(!s)return;openGM(s.a);toast(`🗺 Stop #${id} — Google Maps…`);}
function mapsAll(){
  const stops=sorted().filter(s=>!done.has(s.id));
  if(!stops.length){toast('Tous les stops sont faits !');return;}
  if(stops.length===1){openGM(stops[0].a);return;}
  const dest=encodeURIComponent(fixAddr(stops[stops.length-1].a));
  const wp=stops.slice(0,-1).map(s=>encodeURIComponent(fixAddr(s.a))).join('|');
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${dest}&waypoints=${wp}&travelmode=driving`);
}
function mapsNext(){const nxt=sorted().find(s=>!done.has(s.id));if(!nxt){toast('Tous faits !');return;}openGM(nxt.a);}

function openMo(id){
  const s=SM[id];
  document.getElementById('mo-num').textContent=`#${s.id}`;
  document.getElementById('mo-name').textContent=s.n;
  document.getElementById('mo-addr').textContent=s.a;
  document.getElementById('mo-note').textContent=s.note||'';
  document.getElementById('mo-gps').onclick=()=>openGM(s.a);
  document.getElementById('mo-del').onclick=()=>{
    sel.delete(id);delete dat[id];done.delete(id);
    syncGrid();badge();saveState();closeMo();renderTour();
    toast(`Stop #${id} supprimé`);
  };
  document.getElementById('mbg').classList.add('open');
}
function closeMo(){document.getElementById('mbg').classList.remove('open');}
document.getElementById('mbg').addEventListener('click',e=>{if(e.target.id==='mbg')closeMo();});

function waLine(s){
  const d=dat[s.id]||{bags:0,gps:0,kp:false};
  if(d.kp)return`${s.id}/kp`;
  const b=d.bags||0,g=d.gps||0;
  if(b===0&&g===0)return`${s.id}/kp`;
  const p=[];if(g>0)p.push(`${g}gp`);if(b>0)p.push(`${b}`);
  return`${s.id}/${p.join('/')}`;
}
function waText(){return sorted().map(s=>waLine(s)).join('\n');}

function renderSum(){
  const stops=sorted();
  let total=0;stops.forEach(s=>{const d=dat[s.id]||{};if(!d.kp)total+=(d.bags||0)+(d.gps||0);});
  document.getElementById('sum-total').textContent=total;
  const now=new Date();
  document.getElementById('sum-date').textContent=now.toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const wp=document.getElementById('wa-prev');wp.innerHTML='';
  if(!stops.length){wp.textContent='(aucun stop)';return;}
  stops.forEach(s=>{
    const d=dat[s.id]||{};const line=waLine(s);const div=document.createElement('div');
    const isKP=d.kp||((!d.bags||d.bags===0)&&(!d.gps||d.gps===0));
    div.className=isKP?'wa-k':((d.gps||0)>0?'wa-g':'wa-n');
    div.textContent=line;wp.appendChild(div);
  });
  const dl=document.getElementById('det-list');dl.innerHTML='';
  stops.forEach(s=>{
    const d=dat[s.id]||{bags:0,gps:0,kp:false};
    const isKP=d.kp||((!d.bags||d.bags===0)&&(!d.gps||d.gps===0));
    let vt,vc;
    if(isKP){vt='KP';vc='dv-k';}
    else if((d.gps||0)>0&&d.bags===0){vt=`${d.gps}GP`;vc='dv-a';}
    else if((d.gps||0)>0){vt=`${d.bags}+${d.gps}GP`;vc='dv-a';}
    else{vt=d.bags;vc='dv-g';}
    const row=document.createElement('div');row.className='det-row';
    row.innerHTML=`<div class="dr-id">${s.id}</div><div class="dr-name">${s.n}</div><div class="dr-val ${vc}">${vt}</div>`;
    dl.appendChild(row);
  });
}

function copyWA(){
  const txt=waText();
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');toast('✓ Copié !');}catch(e){toast('Copie manuelle requise');}document.body.removeChild(ta);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('✓ Copié pour WhatsApp !')).catch(fb);}else fb();
}

function saveTour(){
  const stops=sorted();if(!stops.length){toast('Rien à sauvegarder');return;}
  let total=0;stops.forEach(s=>{const d=dat[s.id]||{};if(!d.kp)total+=(d.bags||0)+(d.gps||0);});
  const rec={date:new Date().toISOString(),wa:waText(),stops:stops.map(s=>({id:s.id,...(dat[s.id]||{})})),total};
  const hist=JSON.parse(localStorage.getItem('t2hist')||'[]');
  hist.unshift(rec);localStorage.setItem('t2hist',JSON.stringify(hist.slice(0,30)));
  newTour();go('hist');toast('Tournée sauvegardée ✓');
}

function renderHist(){
  const hist=JSON.parse(localStorage.getItem('t2hist')||'[]');
  const el=document.getElementById('hist-list');
  if(!hist.length){el.innerHTML='<div class="empty-msg">Aucune tournée sauvegardée.</div>';return;}
  el.innerHTML='';
  hist.forEach(h=>{
    const d=new Date(h.date);
    const ds=d.toLocaleDateString('fr-CH',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'});
    const c=document.createElement('div');c.className='hcard';
    c.innerHTML=`<div class="hcard-date">${ds}</div><div class="hcard-stats"><div class="hstat"><b>${h.total}</b> sacs</div><div class="hstat"><b>${h.stops.length}</b> stops</div></div><div class="hcard-wa">${(h.wa||'').replace(/\n/g,'<br>')}</div>`;
    el.appendChild(c);
  });
}

function clearHist(){if(!confirm('Effacer tout l\'historique ?'))return;localStorage.removeItem('t2hist');renderHist();}

function saveState(){localStorage.setItem('t2state',JSON.stringify({sel:[...sel],dat,done:[...done]}));}
function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem('t2state')||'{}');
    if(s.sel)sel=new Set(s.sel);if(s.dat)dat=s.dat;if(s.done)done=new Set(s.done);
    syncGrid();badge();
  }catch(e){}
}

let _tt;
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2500);
}

init();
</script>
